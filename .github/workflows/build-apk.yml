
name: Build Astro Drift APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          shopt -s nullglob
          archives=(*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive"
            exit 1
          fi
          unzip -q "${archives[0]}"
          test -f astro-drift/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p astro-drift assembleDebug --no-daemon --console=plain

      - name: Verify APK
        run: test -s astro-drift/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astro-drift-apk
          path: astro-drift/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        run: gradle -p astro-drift testDebugUnitTest --no-daemon --console=plain
